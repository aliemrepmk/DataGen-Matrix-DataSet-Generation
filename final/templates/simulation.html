<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEM Solver Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f7f7; }
        .container-flat {
            background-color: #fff;
            padding: 32px 24px;
            border-radius: 8px;
            margin-top: 40px;
            margin-bottom: 40px;
            box-shadow: none;
        }
        h1 { color: #222; text-align: center; font-weight: 600; margin-bottom: 32px; }
        label { margin-top: 15px; margin-bottom: 5px; font-weight: 500; }
        select, input[type="text"], input[type="number"], input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fafbfc;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #0d6efd;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        input[type="submit"]:hover { background-color: #0b5ed7; }
        .parameter-section {
            display: none;
            border: 1px solid #f0f0f0;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .parameter-section h3 { margin-top: 0; color: #555; font-size: 1.1rem; }
        .grid-2-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    </style>
</head>
<body>
    <div class="container container-flat">
        <h1>FEM Problem Solver</h1>
        <form action="{{ url_for('solve_problem') }}" method="POST">
            <label for="problem_type">Select Problem Type:</label>
            <select name="problem_type" id="problem_type" onchange="showParameters()">
                <option value="">-- Select a Problem --</option>
                {% for pt in problem_types %}
                    <option value="{{ pt.value }}">{{ pt.label }}</option>
                {% endfor %}
            </select>

            <div id="params_fluid_symmetric_custom" class="parameter-section">
                <h3>Fluid Mechanics Parameters</h3>
                <div class="grid-2-col">
                    <div>
                        <label for="fluid_sym_custom_mesh_type">Mesh Type:</label>
                        <select name="fluid_sym_custom_mesh_type">
                            {% for mo in mesh_options %}<option value="{{ mo }}">{{ mo|capitalize }}</option>{% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="fluid_sym_custom_mesh_res">Mesh Resolution Hint:</label>
                        <input type="number" name="fluid_sym_custom_mesh_res" value="20" min="3">
                    </div>
                    <div>
                        <label for="fluid_sym_custom_viscosity">Viscosity:</label>
                        <input type="number" name="fluid_sym_custom_viscosity" value="10.0" step="any">
                    </div>
                    <div>
                        <label for="fluid_sym_custom_reg_param">Regularization Param (Pressure Mass):</label>
                        <input type="text" name="fluid_sym_custom_reg_param" value="3e-6">
                    </div>
                </div>
            </div>

            <div id="params_heat" class="parameter-section">
                <h3>Heat Transfer Parameters</h3>
                <div class="grid-2-col">
                    <div>
                        <label for="heat_mesh_type">Mesh Type:</label>
                        <select name="heat_mesh_type">
                             {% for mo in mesh_options %}<option value="{{ mo }}">{{ mo|capitalize }}</option>{% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="heat_mesh_res">Mesh Resolution Hint:</label>
                        <input type="number" name="heat_mesh_res" value="20" min="3">
                    </div>
                    <div>
                        <label for="heat_kappa">Thermal Diffusivity (κ):</label>
                        <input type="number" name="heat_kappa" value="0.5" step="any" min="0">
                    </div>
                    <div>
                        <label for="heat_t_end">End Time (t_end):</label>
                        <input type="number" name="heat_t_end" value="0.5" step="any" min="0">
                    </div>
                    <div>
                        <label for="heat_dt">Time Step (dt):</label>
                        <input type="number" name="heat_dt" value="0.01" step="any" min="0">
                    </div>
                    <div>
                        <label for="heat_theta">Theta (Time Integration):</label>
                        <input type="number" name="heat_theta" value="0.7" step="any" min="0" max="1">
                         <small>(0: Exp, 0.5: Crank-Nicolson, 1: Imp)</small>
                    </div>
                </div>
            </div>

            <div id="params_solid" class="parameter-section">
                <h3>Solid Mechanics Parameters</h3>
                 <div class="grid-2-col">
                    <div>
                        <label for="solid_mesh_type">Mesh Type:</label>
                        <select name="solid_mesh_type">
                             {% for mo in mesh_options %}<option value="{{ mo }}">{{ mo|capitalize }}</option>{% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="solid_mesh_res">Mesh Resolution Hint:</label>
                        <input type="number" name="solid_mesh_res" value="20" min="3">
                    </div>
                    <div>
                        <label for="solid_E">Young's Modulus (E):</label>
                        <input type="text" name="solid_E" value="2e10">
                    </div>
                    <div>
                        <label for="solid_nu">Poisson's Ratio (ν):</label>
                        <input type="number" name="solid_nu" value="0.3" step="any" min="0" max="0.5">
                    </div>
                     <div>
                        <label for="solid_traction">Traction (on right edge, x-dir):</label>
                        <input type="text" name="solid_traction" value="1e6">
                    </div>
                    <div>
                        <label for="solid_deformed_scale">Deformed Mesh Scale Factor:</label>
                        <input type="text" name="solid_deformed_scale" value="100">
                    </div>
                </div>
            </div>

            <div id="params_convection_diffusion" class="parameter-section">
                <h3>Convection-Diffusion Parameters</h3>
                <div class="grid-2-col">
                     <div>
                        <label for="cd_mesh_type">Mesh Type:</label>
                        <select name="cd_mesh_type">
                             {% for mo in mesh_options %}<option value="{{ mo }}">{{ mo|capitalize }}</option>{% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="cd_mesh_res">Mesh Resolution Hint:</label>
                        <input type="number" name="cd_mesh_res" value="20" min="3">
                    </div>
                    <div>
                        <label for="cd_epsilon">Diffusion Coeff (ε):</label>
                        <input type="text" name="cd_epsilon" value="0.01">
                    </div>
                    <div>
                        <label for="cd_b_field_x">Advection Field (bx):</label>
                        <input type="number" name="cd_b_field_x" value="1.0" step="any">
                    </div>
                    <div>
                        <label for="cd_b_field_y">Advection Field (by):</label>
                        <input type="number" name="cd_b_field_y" value="0.5" step="any">
                    </div>
                    <div>
                        <label for="cd_f_value">Source Term (f):</label>
                        <input type="number" name="cd_f_value" value="1.0" step="any">
                    </div>
                </div>
            </div>

            <div id="params_minimal_surface" class="parameter-section">
                <h3>Minimal Surface Parameters</h3>
                 <div class="grid-2-col">
                    <div>
                        <label for="ms_mesh_type">Mesh Type:</label>
                        <select name="ms_mesh_type">
                            {% for mo in mesh_options %}<option value="{{ mo }}">{{ mo|capitalize }}</option>{% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="ms_mesh_res">Mesh Resolution Hint:</label>
                        <input type="number" name="ms_mesh_res" value="20" min="3">
                    </div>
                    <div>
                        <label for="ms_max_iters">Max Newton Iterations:</label>
                        <input type="number" name="ms_max_iters" value="30" min="1">
                    </div>
                    <div>
                        <label for="ms_tolerance">Tolerance:</label>
                        <input type="text" name="ms_tolerance" value="1e-7">
                    </div>
                    <div>
                        <label for="ms_relaxation">Relaxation Factor:</label>
                        <input type="number" name="ms_relaxation" value="0.7" step="any" min="0.01" max="1.0">
                    </div>
                </div>
            </div>

            <input type="submit" value="Run Simulation">
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('welcome') }}" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <script>
        function showParameters() {
            // Hide all parameter sections first
            var sections = document.querySelectorAll('.parameter-section');
            sections.forEach(function(section) {
                section.style.display = 'none';
            });

            // Show the selected one
            var selectedProblem = document.getElementById('problem_type').value;
            if (selectedProblem) {
                var selectedSection = document.getElementById('params_' + selectedProblem);
                if (selectedSection) {
                    selectedSection.style.display = 'block';
                }
            }
        }
        // Initialize on page load in case a value is pre-selected (e.g., after form error)
        document.addEventListener('DOMContentLoaded', showParameters);
    </script>
</body>
</html>
