<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #d9534f; /* Bootstrap's danger color */ }
        .error-message {
            background-color: #f2dede; /* Light red background */
            color: #a94442; /* Dark red text */
            border: 1px solid #ebccd1; /* Reddish border */
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: left;
            white-space: pre-wrap; /* Preserve whitespace and newlines in error message */
        }
        a.back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #5cb85c;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        a.back-link:hover { background-color: #4cae4c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oops! An Error Occurred</h1>

        <p>Something went wrong while processing your request.</p>

        {% if error_message %}
            <h2>Error Details:</h2>
            <div class="error-message">
                <p>{{ error_message }}</p>
            </div>
        {% endif %}

        <p>Please try again, or adjust your input parameters.</p>

        <a href="{{ url_for('simulation') }}" class="back-link">&laquo; Go Back to Input Form</a>
    </div>
</body>
</html>
