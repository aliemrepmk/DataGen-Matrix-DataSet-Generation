<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dataset_generator.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1 class="display-4">Matrix Generator</h1>
            <p class="lead">Generate a single matrix with specified parameters</p>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="matrixForm" action="/generate-matrix" method="POST" enctype="multipart/form-data">
                    <!-- Upload Matrix Folder -->
                    <div class="form-group mb-3">
                        <label for="matrix_folder">Select Folder Containing .mtx Files</label>
                        <input type="file" class="form-control" id="matrix_folder" name="matrix_folder" webkitdirectory directory multiple required>
                    </div>
                    <!-- Matrix File Dropdown -->
                    <div class="form-group mb-3" id="matrixFileDropdownGroup" style="display: none;">
                        <label for="matrix_file_select">Choose a Matrix File</label>
                        <select class="form-control" id="matrix_file_select" name="matrix_file_select" required></select>
                    </div>

                    <!-- Algorithm Selection -->
                    <div class="form-group mb-3">
                        <label for="algorithm">Select Generation Algorithm</label>
                        <select class="form-control" id="algorithm" name="algorithm" required>
                            <option value="bilinear">Bi-linear Interpolation</option>
                            <option value="dct">DCT Blockwise</option>
                            <option value="fourier">Fourier Transform</option>
                            <option value="gaussian">Gaussian Pyramids</option>
                            <option value="graph">Graph Coarsening & Refinement</option>
                            <option value="image">Image-based Scaling</option>
                            <option value="lanczos">Lanczos Resampling</option>
                            <option value="nearest">Nearest-neighbor Interpolation</option>
                            <option value="wavelet">Wavelet Transformation</option>
                        </select>
                    </div>

                    <!-- Wavelet Type -->
                    <div class="form-group mb-3" id="waveletTypeGroup" style="display: none;">
                        <label for="wavelet_type">Select Wavelet Level</label>
                        <select class="form-control" id="wavelet_type" name="wavelet_type">
                            <option value="1">Level 1</option>
                            <option value="2">Level 2</option>
                            <option value="3">Level 3</option>
                        </select>
                    </div>

                    <!-- Image Resampling Method -->
                    <div class="form-group mb-3" id="imageResamplingGroup" style="display: none;">
                        <label for="image_resampling_method">Select Image Resampling Method</label>
                        <select class="form-control" id="image_resampling_method" name="image_resampling_method">
                            <option value="Image.NEAREST">Nearest</option>
                            <option value="Image.BOX">Box</option>
                            <option value="Image.BILINEAR">Bilinear</option>
                            <option value="Image.HAMMING">Hamming</option>
                            <option value="Image.BICUBIC">Bicubic</option>
                            <option value="Image.LANCZOS">Lanczos</option>
                        </select>
                    </div>

                    <!-- Kernel Size -->
                    <div class="form-group mb-3" id="kernelSizeGroup" style="display: none;">
                        <label for="kernel_size">Kernel Size</label>
                        <input type="number" class="form-control" id="kernel_size" name="kernel_size" min="3" step="2" value="3">
                    </div>

                    <!-- Row / Column Inputs -->
                    <div class="form-row mb-3">
                        <div class="col">
                            <label for="rows">Rows</label>
                            <input type="number" class="form-control" id="rows" name="rows" required min="1">
                        </div>
                        <div class="col">
                            <label for="cols">Columns</label>
                            <input type="number" class="form-control" id="cols" name="cols" required min="1">
                        </div>
                    </div>

                    <!-- Checkboxes -->
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="match_nnz" name="match_nnz">
                        <label class="form-check-label" for="match_nnz">Match the number of non-zero values</label>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="optimize" name="optimize">
                        <label class="form-check-label" for="optimize">Optimize after generation</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Generate Matrix</button>
                </form>
            </div>
        </div>

        <div id="loading" class="text-center mt-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Generating matrix...</p>
        </div>

        <div id="results" class="mt-4"></div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="messageModalLabel">Notification</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="messageModalBody">
            <!-- Message will be injected here -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/matrix_generator.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const algorithmSelect = document.getElementById('algorithm');
            const waveletTypeGroup = document.getElementById('waveletTypeGroup');
            const imageResamplingGroup = document.getElementById('imageResamplingGroup');
            const kernelSizeGroup = document.getElementById('kernelSizeGroup');

            algorithmSelect.addEventListener('change', function() {
                const value = this.value;
                waveletTypeGroup.style.display = value === 'wavelet' ? 'block' : 'none';
                imageResamplingGroup.style.display = value === 'image' ? 'block' : 'none';
                kernelSizeGroup.style.display = value === 'lanczos' ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
