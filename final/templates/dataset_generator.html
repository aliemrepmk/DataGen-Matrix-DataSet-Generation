<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dataset_generator.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1 class="display-4">Dataset Generator</h1>
            <p class="lead">Generate multiple matrices with various scaling methods</p>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="matrixForm">
                    <div class="form-group mb-3">
                        <label for="matrix_folder">Select Folder Containing .mtx Files</label>
                        <input type="file" class="form-control" id="matrix_folder" name="matrix_folder" webkitdirectory directory multiple required>
                    </div>
                    <div class="form-group mb-3" id="matrixFileDropdownGroup" style="display: none;">
                        <label for="matrix_file_select">Choose a Matrix File</label>
                        <select class="form-control" id="matrix_file_select" name="matrix_file_select" required></select>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="num_matrices" class="form-label">Number of Matrices</label>
                        <input type="number" class="form-control" id="num_matrices" name="num_matrices" min="1" value="1" required>
                    </div>
                    
                    <div class="form-row mb-3">
                        <div class="col">
                            <label for="min_dim" class="form-label">Minimum Dimension</label>
                            <input type="number" class="form-control" id="min_dim" name="min_dim" min="1" value="100" required>
                        </div>
                        <div class="col">
                            <label for="max_dim" class="form-label">Maximum Dimension</label>
                            <input type="number" class="form-control" id="max_dim" name="max_dim" min="1" value="1000" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Generate Matrices</button>
                </form>
            </div>
        </div>

        <div id="loading" class="text-center mt-4">
            <div class="progress mb-3">
                <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%" 
                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
            <p class="mt-2">Generating matrices...</p>
        </div>

        <div id="results" class="mt-4"></div>

        <div class="text-center mt-4">
            <a href="{{ url_for('welcome') }}" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="messageModalLabel">Notification</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="messageModalBody">
            <!-- Message will be injected here -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dataset_generator.js') }}"></script>
</body>
</html>
