<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Neural Network</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h1 class="display-5">Train Your Own Neural Network</h1>
            <p class="lead">Select your dataset and training parameters below.</p>
        </div>
        <form method="POST" action="{{ url_for('train_network') }}" enctype="multipart/form-data" class="mx-auto" style="max-width: 500px;">
            <div class="mb-3">
                <label for="dataset_folder" class="form-label">Select Dataset Folder (.mtx files)</label>
                <input class="form-control" type="file" id="dataset_folder" name="dataset_folder" webkitdirectory directory multiple required>
            </div>
            <div class="mb-3">
                <label for="epochs" class="form-label">Epochs</label>
                <input type="number" class="form-control" id="epochs" name="epochs" value="20" min="1" required>
            </div>
            <div class="mb-3">
                <label for="batch_size" class="form-label">Batch Size</label>
                <input type="number" class="form-control" id="batch_size" name="batch_size" value="32" min="1" required>
            </div>
            <div class="mb-3">
                <label for="learning_rate" class="form-label">Learning Rate</label>
                <input type="number" class="form-control" id="learning_rate" name="learning_rate" value="0.001" step="any" min="0" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Start Training</button>
        </form>
        <div class="text-center mt-4">
            <a href="{{ url_for('neural_network') }}" class="btn btn-secondary">Back to Neural Network</a>
        </div>
    </div>
</body>
</html>
